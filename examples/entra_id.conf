# ==============================================================================
# pam_oidc_device - Microsoft Entra ID / Enterprise Cloud Template
# ==============================================================================
# Archetype: Cloud enterprise provider (Microsoft Entra ID / Azure AD, Okta, Auth0)
# Identity Model: Public client with domain-pinned claim mapping (e.g., jdoe@company.com -> jdoe)

[oauth]
# Application (client) ID assigned in Entra ID App Registrations
client_id = 00000000-0000-0000-0000-000000000000
# Client Secret is omitted/empty for public client device authorization flow
client_secret =
# Entra ID v2.0 Device Authorization Endpoint ({tenant} can be tenant ID or domain)
device_authorization_endpoint = https://login.microsoftonline.com/YOUR_TENANT_ID/oauth2/v2.0/devicecode
# Entra ID v2.0 Token Endpoint
token_endpoint = https://login.microsoftonline.com/YOUR_TENANT_ID/oauth2/v2.0/token
# Microsoft Graph UserInfo Endpoint
userinfo_endpoint = https://graph.microsoft.com/oidc/userinfo
# OIDC Scopes requested during authentication
scopes = openid profile email
# PKCE with the device flow: the Microsoft Entra ID v2.0 device-code reference
# does not document code_challenge support (as of 2026-11). Keep PKCE disabled
# until a live test-client probe against YOUR tenant proves support (procedure:
# examples/README.md, "Does Your Provider Support PKCE with the Device Flow?").
#use_pkce = false

[claim]
# Claim field: use 'email'. Note: the Microsoft Graph OIDC UserInfo endpoint does NOT
# return preferred_username/UPN; it returns only sub, name, family_name, given_name,
# picture, and email (the 'email' scope requested in [oauth] above must be present).
claim_field = email
# Pinned-domain regex: extract the local username ONLY from email addresses belonging to
# your own tenant. Group 1 captures the username, and the @domain suffix is REQUIRED,
# so 'jdoe@competitor.com' does NOT map to local 'jdoe'. Replace 'company.com' with
# your organization's email/domain suffix.
# NOTE: the regex is always matched case-sensitively; write the domain in the exact
# case the IdP returns it (lowercase for standard email domains).
claim_regex = ^([^@]+)@company[.]com$
# Capture group index containing the local username handle
claim_capture_group = 1
# Case-insensitive comparison applies ONLY to the extracted local username vs. PAM_USER;
# it does NOT make the regex/domain match case-insensitive.
case_sensitive = false

[access]
# Optional account & group controls (comma-separated). Deny lists take precedence
# over allow lists. Local user lists are enforced before any provider contact.
# Only these local accounts may authenticate (empty = all allowed)
#allow_users = jdoe,asmith,tkhan
# These local accounts can never authenticate (precedence over allow_users)
#deny_users = root,daemon
# Provider group claims: the Microsoft Graph /oidc/userinfo endpoint does NOT return
# group memberships by default. If your tenant surfaces a custom 'groups' claim, point
# group_claim_field at it and populate the allow/deny lists below.
#group_claim_field = groups
#allow_groups = ssh-admins,dev-team
#deny_groups = suspended

[prompt]
# Custom prompt string for corporate terminal logins
init_message = Microsoft Entra ID Authentication Required:\n  URL:  {url}\n  Code: {code}\nWaiting for your approval; this session completes automatically once you sign in.

[runtime]
# Extended polling window (10 mins) allows users time to complete enterprise conditional access / MFA
max_poll_seconds = 600
# Syslog verbosity level
loglevel = info
