# ==============================================================================
# pam_oidc_device - Keycloak / Self-Hosted OIDC Configuration Template
# ==============================================================================
# Archetype: On-premises or self-hosted identity provider (Keycloak, ZITADEL, Hydra)
# Identity Model: Direct 1:1 mapping from 'preferred_username' claim to POSIX user
 
[oauth]
# OAuth 2.0 Client Identifier registered in Keycloak realm
client_id = pam-device-client
# OAuth 2.0 Client Secret (leave blank or omit if client is configured as Public in Keycloak)
client_secret = your-keycloak-client-secret
# Keycloak OIDC Device Authorization Endpoint
device_authorization_endpoint = https://auth.example.com/realms/myrealm/protocol/openid-connect/auth/device
# Keycloak OIDC Token Endpoint
token_endpoint = https://auth.example.com/realms/myrealm/protocol/openid-connect/token
# Keycloak OIDC UserInfo Endpoint
userinfo_endpoint = https://auth.example.com/realms/myrealm/protocol/openid-connect/userinfo
# Requested scopes (must include 'openid')
scopes = openid profile

[claim]
# JSON field in UserInfo response containing the identity handle
claim_field = preferred_username
# POSIX regular expression to match and extract local account username
# Default pattern extracts printable username string directly
claim_regex = ^([a-zA-Z0-9._-]+)$
# Regex capture group index containing the target local account string
claim_capture_group = 1
# Enforce strict case sensitivity on local username matching (1 = true, 0 = false)
case_sensitive = true

[access]
# Optional account & group controls (comma-separated). Deny lists take precedence
# over allow lists. Local user lists are enforced before any provider contact.
# Only these local accounts may authenticate (empty = all allowed)
#allow_users = jdoe,asmith,tkhan
# These local accounts can never authenticate (precedence over allow_users)
#deny_users = root
# JSON field in the Keycloak UserInfo response holding group memberships
#group_claim_field = groups
# Provider groups that grant access (a user matching ANY of these is allowed)
#allow_groups = administrators,ssh-access,devs
# Provider groups that deny access (precedence over allow_groups)
#deny_groups = suspended,contractors

[prompt]
# Custom terminal instructions displayed to the authenticating user
# Placeholders: {url}, {url_complete}, {code}, and '\n' for newlines
init_message = \nComplete Keycloak login in browser:\n  URL:  {url}\n  Code: {code}\n\nPress [Enter] after authenticating in browser...

[runtime]
# Maximum polling duration in seconds before timing out authentication
max_poll_seconds = 300
# Syslog verbosity level: none, error, info, debug, or verbose
loglevel = info
