# ==============================================================================
# pam_oidc_device - CILogon / Federated Academic & Research Template
# ==============================================================================
# Archetype: Academic research infrastructure (CILogon, Globus Auth, ACCESS)
# Identity Model: Institutional ePPN / EduPersonPrincipalName extraction

[oauth]
# CILogon registered client identifier
client_id = cilogon:/client_id/0123456789abcdef
# CILogon registered client secret
client_secret = your-cilogon-client-secret
# CILogon OAuth 2.0 Device Code Endpoint
device_authorization_endpoint = https://cilogon.org/oauth2/devicecode
# CILogon Token Endpoint
token_endpoint = https://cilogon.org/oauth2/token
# CILogon UserInfo Endpoint
userinfo_endpoint = https://cilogon.org/oauth2/userinfo
# CILogon specific scope to retrieve ePPN institutional attribute
scopes = openid profile email org.cilogon.userinfo

[claim]
# Claim attribute containing EduPersonPrincipalName (e.g., user@institution.edu)
claim_field = eppn
# Pinned-domain regex: extract the local username ONLY from claims belonging to a
# specific institution. Group 1 captures the username, and the @domain suffix is
# REQUIRED, so jdoe@otheruniversity.edu does NOT map to local jdoe. Replace
# 'institution.edu' with your institution's registered domain.
# NOTE: the regex is always matched case-sensitively; write the domain in the exact
# case the IdP returns it (lowercase for standard ePPN/UPN domains).
claim_regex = ^([^@]+)@institution[.]edu$
# Capture group 1 selects local username slice
claim_capture_group = 1
# Case-insensitive comparison applies ONLY to the extracted local username vs. PAM_USER;
# it does NOT make the regex/domain match case-insensitive.
case_sensitive = false

[access]
# Optional account & group controls (comma-separated). Deny lists take precedence
# over allow lists. Local user lists are enforced before any provider contact.
# Only these local accounts may authenticate (empty = all allowed)
#allow_users = jdoe,asmith,tkhan
# These local accounts can never authenticate (precedence over allow_users)
#deny_users = root
# CILogon returns group memberships under the 'org.cilogon.groups' attribute when the
# corresponding scope is requested; point group_claim_field at that field.
#group_claim_field = org.cilogon.groups
# Provider groups that grant access (a user matching ANY of these is allowed)
#allow_groups = ssh-access, researchers, sysadmins
# Provider groups that deny access (precedence over allow_groups)
#deny_groups = suspended,contractors

[prompt]
# Prompt message highlighting direct verification link support
init_message = \nCILogon Institutional Login:\n  URL:    {url}\n  Code:   {code}\n  Direct: {url_complete}\n\nPress [Enter] once authenticated...

[runtime]
# Maximum polling threshold in seconds
max_poll_seconds = 300
# Syslog verbosity level
loglevel = info
