name: Build and Package Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compile-matrix:
    name: Compile & Test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.compiler }} libpam0g-dev libcurl4-openssl-dev libjson-c-dev libcmocka-dev libssl-dev zbar-tools

      - name: Build shared module
        run: make CC=${{ matrix.compiler }}

      - name: Run unit test suite
        run: make test CC=${{ matrix.compiler }}

  # ASan/UBSan/LSan execution gate (B1/B3): `make test-sanitize` builds AND RUNS
  # the CMocka suite under the sanitizers. The compile-only `make sanitize`
  # target is NOT a CI gate; this job is the only sanitizer check enforced
  # here, and it actually executes the tests, so heap overflow/underflow,
  # use-after-free, undefined behavior, and memory leaks are detected and
  # CI-enforced. clang is used for its first-class ASan/UBSan/LSan
  # support. Known intentional third-party process-lifetime allocations (libcurl
  # global state) are documented in tests/lsan.supp.
  sanitize-test:
    name: Sanitizer Build & Test (ASan/UBSan/LSan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libpam0g-dev libcurl4-openssl-dev libjson-c-dev libcmocka-dev libssl-dev zbar-tools

      - name: Build and run unit test suite under ASan/UBSan/LSan
        run: make test-sanitize CC=clang

  # Independent QR scanner gate: renders the verification-URI terminal art with
  # the production code path (tests/qr_scan/qr_render_check.c over src/qr.c +
  # the vendored Nayuki encoder), rasterizes BOTH terminal styles exactly as a
  # monospace terminal displays them (tests/qr_scan/art2png.py, as P5 PGM:
  # spec-trivial and decodable under any zbarimg image backend), and requires zbarimg (libzbar — a
  # decoder independent of the Nayuki encoder and of the local ZXing fixture
  # check) to recover the exact URI. The rendered art is also published in the
  # job summary so a maintainer can scan it with a phone camera — the "real
  # terminal conditions" leg that a headless CI decode cannot provide.
  qr-scan-audit:
    name: Independent QR Scan Verification (zbar)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.7

      - name: Install scanner and headers
        run: |
          sudo apt-get update
          sudo apt-get install -y zbar-tools libpam0g-dev libcurl4-openssl-dev libjson-c-dev

      - name: Build QR render harness
        run: |
          mkdir -p build
          gcc -O2 -Iinclude -D_GNU_SOURCE -Wall -Wextra -Werror \
              src/qr.c third_party/qrcodegen/qrcodegen.c \
              tests/qr_scan/qr_render_check.c -o build/qr_render_check

      - name: Render terminal art and decode with zbarimg
        run: |
          set -euo pipefail
          URI="https://auth.example.edu/link?code=WXYZ-9012"
          ./build/qr_render_check "$URI" build/qr_art_utf8.txt build/qr_art_ascii.txt 3 > /dev/null
          python3 tests/qr_scan/art2png.py build/qr_art_utf8.txt build/qr_art_utf8.pgm 3
          python3 tests/qr_scan/art2png.py build/qr_art_ascii.txt build/qr_art_ascii.pgm 3
          got_utf8=$(zbarimg --quiet --raw build/qr_art_utf8.pgm)
          got_ascii=$(zbarimg --quiet --raw build/qr_art_ascii.pgm)
          echo "zbar decoded (UTF-8 art):  $got_utf8"
          echo "zbar decoded (ASCII art):  $got_ascii"
          [ "$got_utf8" = "$URI" ]
          [ "$got_ascii" = "$URI" ]

      - name: Publish art for phone-camera scan
        run: |
          {
            echo '## Terminal QR art — scan with a phone camera'
            echo
            echo 'The block below is the scale-1 ASCII rendering produced by the'
            echo 'module; point a phone camera at a terminal showing it to verify'
            echo 'decodability under real terminal conditions.'
            echo
            echo '```'
            cat build/qr_art_ascii.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  rpm-build:
    name: Native ${{ matrix.distro.name }} RPM Package Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - name: "EL8"
            image: "rockylinux/rockylinux:8"
            config_pkg: "dnf-utils"
            optional_repo: "powertools"
          - name: "EL9"
            image: "rockylinux/rockylinux:9"
            config_pkg: "dnf-plugins-core"
            optional_repo: "crb"
          - name: "EL10"
            image: "rockylinux/rockylinux:10"
            config_pkg: "dnf-plugins-core"
            optional_repo: "crb"
    container:
      image: ${{ matrix.distro.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.7

      - name: Enable optional repo and install build dependencies
        run: |
          dnf install -y ${{ matrix.distro.config_pkg }}
          dnf config-manager --set-enabled ${{ matrix.distro.optional_repo }}
          dnf install -y gcc pam-devel libcurl-devel json-c-devel openssl-devel libcmocka-devel rpm-build make tar python3

      - name: Verify RPM creation and run %check tests
        run: make rpm

      - name: Verify generated RPM package
        run: |
          MAIN_RPM=$(find rpmbuild/RPMS -name "pam_oidc_device-[0-9]*.rpm")
          dnf localinstall -y "$MAIN_RPM"
          ls -la /lib64/security/pam_oidc_device.so
          ls -la /etc/pam_oidc_device.conf
