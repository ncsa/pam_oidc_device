name: License & Third-Party Compliance

# Mechanical third-party license compliance (THIRD_PARTY_NOTICES.md):
#   * license-compliance: scripts/check-licenses.sh verifies THIRD_PARTY_NOTICES.md is
#     present, every third_party/*/ component carries license text + attribution +
#     provenance, no copyleft is vendored, and the RPM spec's runtime dependencies are
#     declared in the notices file.
#   * dependency-graph-audit: queries GitHub's dependency graph for every manifest/package
#     GitHub has indexed for this repo and fails on any package whose license is not on the
#     permissive allowlist (undeclared packages are flagged). For this pure-C/Make project
#     the graph is currently empty — the gate activates automatically as soon as GitHub
#     indexes a recognized manifest (CMakeLists.txt, package.json, requirements.txt, ...).
#
# No build dependencies: pure bash/grep + the pre-installed gh CLI + python3, so both jobs
# must keep passing on a bare checkout.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 8 1 * *" # 08:00 UTC on the 1st of each month (alongside the vendor audit)
  workflow_dispatch: {}

# Least privilege: these jobs only need to read the repository contents (the dependency
# graph API is readable with the default read-only workflow token).
permissions:
  contents: read

# Cancel superseded runs of this workflow on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-compliance:
    name: Third-Party Notices & Vendored License Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run license compliance checks
        run: ./scripts/check-licenses.sh

  dependency-graph-audit:
    name: GitHub Dependency Graph License Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Query GitHub dependency graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          owner="${GITHUB_REPOSITORY_OWNER}"
          repo="${GITHUB_REPOSITORY#*/}"
          query='query { repository(owner: "'"${owner}"'", name: "'"${repo}"'") {
              dependencyGraph { packagesV2(first: 100) { nodes {
                name ecosystem manifestName version
                licenses { license { key name } }
              } } } } }'
          # The Repository.dependencyGraph field is feature-gated in GitHub's
          # GraphQL schema: on accounts where the supply-chain dependency
          # graph is not enabled the query fails at VALIDATION time with
          # "Field 'dependencyGraph' doesn't exist on type 'Repository'".
          # In that case, try the REST dependencies endpoint; if that also
          # returns 404 (the endpoint is feature-gated and/or the repo is
          # private / has no indexed manifests), record an empty payload so
          # the audit is a clean no-op instead of a failure. GITHUB_REPOSITORY
          # always names a repo that exists in CI, so a 404 here means "no
          # dependency-graph data available", not a misconfiguration.
          if gh api graphql -f "query=${query}" > dependency-graph.json 2> gh-query.err; then
            echo "GraphQL dependency-graph query OK"
          elif grep -q "Field 'dependencyGraph' doesn't exist on type 'Repository'" gh-query.err; then
            echo "INFO: Repository.dependencyGraph is not in the GraphQL schema on this account (feature-gated)."
            echo "INFO: trying REST /repos/${owner}/${repo}/dependencies"
            if gh api "repos/${owner}/${repo}/dependencies" > dependency-graph.json 2> gh-rest.err; then
              echo "INFO: REST dependencies query OK"
            elif grep -q "HTTP 404" gh-rest.err; then
              echo "INFO: no dependency-graph data available for this repository (feature off, private repo, or no indexed manifests) - audit will be a no-op."
              echo '[]' > dependency-graph.json
            else
              echo "::error::GitHub dependency-graph REST query failed:"
              cat gh-rest.err >&2
              exit 1
            fi
          else
            echo "::error::GitHub dependency-graph query failed:"
            cat gh-query.err >&2
            exit 1
          fi

      - name: Audit indexed dependencies against the license allowlist
        run: python3 scripts/audit-dependency-graph.py dependency-graph.json
