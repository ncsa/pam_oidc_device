# Sandbox e2e configuration for pam_oidc_device (tests/e2e).
#
# Installs to /etc/pam_oidc_device.conf (0600 root:root) by tests/e2e/run_e2e.sh.
# All endpoints target the local mock provider on 127.0.0.1:8443 over TLS with
# a self-signed certificate trusted through the system CA store, so the
# module's strict https:// endpoint validation and mandatory TLS certificate
# verification are exercised exactly as against a production provider.
#
# [oauth] exercises the full hardening path: PKCE S256 binding plus local
# claims-only JWT inspection (iss/aud/exp/nbf) of the issued access token.

[oauth]
client_id = e2e-sandbox-client
client_secret = e2e-sandbox-secret-not-real
device_authorization_endpoint = https://127.0.0.1:8443/oauth2/device/code
token_endpoint = https://127.0.0.1:8443/oauth2/token
userinfo_endpoint = https://127.0.0.1:8443/oauth2/userinfo
scopes = openid profile email
verify_jwt_claims = true
issuer = https://127.0.0.1:8443
audience = urn:pam-oidc-device:e2e
clock_skew_leeway = 60
require_exp_claim = true
use_pkce = true

[claim]
claim_field = preferred_username
claim_regex = ^([^@]+)@sandbox[.]test$
claim_capture_group = 1
case_sensitive = true

[access]
allow_users = alice,bob
deny_users = daemon
allow_root = false
group_claim_field = groups
allow_groups = e2e-ops
enforce_groups = true

[prompt]
init_message = [E2E Sandbox] Complete authentication on your second device:\n Verification URL: {url}\n User Code: {code}\n Direct Link: {url_complete}\nWaiting for approval to sign in to {host}; this session completes automatically once you sign in.

[runtime]
max_poll_seconds = 120
loglevel = debug
