# /etc/pam_oidc_device.conf
#
# Configuration file for pam_oidc_device.so
# OAuth 2.0 Device Authorization Grant authentication
#
# REQUIRED PERMISSIONS:
# Must be owned by root (uid 0) with mode 0600 or 0640 (group gid 0).
#   chown root:root /etc/pam_oidc_device.conf
#   chmod 0600 /etc/pam_oidc_device.conf

[oauth]
# Client credentials (leave client_secret empty for public clients)
client_id = ssh-login-node-client
client_secret = super-secret-key-change-me

# Required HTTPS OAuth 2.0 / OIDC Endpoints
device_authorization_endpoint = https://auth.example.edu/oauth2/device/code
token_endpoint = https://auth.example.edu/oauth2/token
userinfo_endpoint = https://auth.example.edu/oauth2/userinfo

# OAuth Scopes requested during device authorization (default: openid)
scopes = openid profile email

# Optional Local JWT Claim Inspection Settings (claims-only; does not verify the JWT signature)
# Enforce local Base64URL decoding and claims-only checks (exp, nbf, iss, aud) before downstream calls (default: false).
# NOTE: This inspects decoded JWT claims locally; it does NOT verify the JWT signature.
# The signature is still validated by the UserInfo endpoint when the Bearer token is presented.
#verify_jwt_claims = false
# Expected Token Issuer URL ('iss' claim check). Required if verify_jwt_claims = true.
#issuer = https://auth.example.edu/oauth2
# Expected Audience string or comma-separated list ('aud' claim check). Required if verify_jwt_claims = true.
#audience = https://api.example.edu
# Allowed clock skew leeway in seconds when evaluating 'exp' and 'nbf' timestamps (range: 0 - 300, default: 60)
#clock_skew_leeway = 60
# Require a well-formed 'exp' claim in locally verified tokens; reject tokens without one (default: false).
# A missing 'exp' is otherwise accepted and left to the downstream UserInfo endpoint to enforce expiry.
#require_exp_claim = false
# Reserved (parsed/validated but NOT yet used): the module does not currently
# perform JWKS-based JWT signature verification, so jwks_url has no effect.
#jwks_url = https://auth.example.edu/oauth2/jwks
# Reserved (parsed/validated but NOT yet used): RFC 7662 token introspection is
# not currently performed, so introspection_endpoint has no effect.
#introspection_endpoint = https://auth.example.edu/oauth2/introspect

# Optional PKCE (RFC 7636) extension of the device flow. When active, a fresh
# high-entropy code_verifier is generated per login attempt: its S256
# code_challenge is sent to the device authorization endpoint and the verifier
# is presented at the token endpoint, binding the token exchange to this device
# flow so a stolen device_code cannot by itself obtain tokens.
# Accepts three values:
#   false (default) - do not send PKCE parameters; works with every provider.
#   true            - always send the S256 code_challenge / code_verifier pair.
#                     REQUIRES provider support for device-flow PKCE; a provider
#                     without support rejects the device-authorization request.
#                     At load time the module logs a reminder to confirm your
#                     provider's support.
#   auto            - probe the provider's discovery document (discovery_endpoint)
#                     once per login and enable PKCE only when the metadata
#                     advertises S256 support (code_challenge_methods_supported)
#                     AND a device_authorization_endpoint; probe failures fail
#                     safe to "no PKCE". The decision is logged each attempt.
# Note: no standard discovery field advertises device-flow PKCE specifically, so
# 'auto' is a heuristic gate. How to determine your provider's real support
# (vendor docs + a live test-client probe) is documented in examples/README.md.
#use_pkce = false
#
# Optional OIDC/OAuth discovery metadata URL; used only when use_pkce = auto.
# Example: https://auth.example.edu/.well-known/openid-configuration
#discovery_endpoint = https://auth.example.edu/.well-known/openid-configuration
#
# Optional outbound HTTPS proxy for all provider traffic (device authorization,
# token polling, UserInfo, and the PKCE discovery probe). Must be an https://
# URL: plain-HTTP proxies are rejected (provider traffic would cross the proxy
# in cleartext), and embedded credentials (https://user:pass@host) are not
# supported. When absent or empty, traffic is routed directly. The *_proxy and
# no_proxy/NO_PROXY environment variables are deliberately ignored in all
# cases.
#proxy = https://proxy.example.edu:3129


[claim]
# UserInfo response field containing the identity claim to match against PAM_USER (default: sub)
claim_field = preferred_username
# POSIX Extended Regular Expression applied to the identity claim. REQUIRED: there is no
# default; config loading fails without an explicit value. The pattern must match the
# shape of the chosen claim_field: 'preferred_username' is normally a bare local username
# ('jdoe'), so the regex below is an anchored POSIX-username character set. Group 1
# captures the local username.
# If your chosen claim is a domain-pinned e-mail instead (e.g. claim_field = email or sub
# = 'jdoe@example.edu'), pin YOUR domain so only claims from your institution/tenant map to
# local accounts:
#   claim_regex = ^([^@]+)@example[.]edu$
# (Replace 'example.edu' with your registered domain, written in the exact case the IdP
# returns it; the regex is always matched case-sensitively.)
claim_regex = ^([a-zA-Z0-9._-]+)$
# Capture group index containing the local system username (1 = first sub-group)
claim_capture_group = 1
# Enforce exact case matching between the extracted local username and PAM_USER (default: true).
# NOTE: this governs only the username comparison; it does not affect regex/domain matching.
case_sensitive = true


[access]
# Local account and provider group/role allow/deny lists (comma-separated). Deny lists
# take precedence over allow lists. Matching honors 'case_sensitive' from [claim].
#
# --- Local account controls ---
# Local user lists are evaluated BEFORE any provider contact; a denied account is
# refused with PAM_PERM_DENIED without reaching the identity provider.
# Only these local usernames may authenticate (comma-separated; empty = all allowed)
#allow_users = alice,bob,charlie
# These local usernames are never permitted to authenticate (takes precedence over allow_users)
#deny_users = root,daemon
# uid-0 accounts are DENIED by default, independent of the user lists above: this covers
# 'root' AND any alternative uid-0 account name (e.g. 'toor'). Listing 'root' in
# allow_users alone does NOT grant access. Set this to true ONLY if you explicitly intend
# to allow interactive root logins through this module (default: false).
#allow_root = false
# Accounts whose numeric UID falls in [system_uid_min, system_uid_max] are DENIED by
# default (deny_system_uids = true; the conventional system range is 0-999). Like the
# uid-0 gate above, the guard targets the UID, not the name: any account holding an
# in-range UID (e.g. a service account) is refused even when listed in allow_users.
# A uid-0 account explicitly allowed via allow_root is exempt. system_uid_min must be
# <= system_uid_max (an inverted range is rejected when the config is loaded).
#deny_system_uids = true
#system_uid_min = 0
#system_uid_max = 999
#
# --- Provider group/role controls ---
# Provider group/role lists are evaluated against the UserInfo group/role claims.
# JSON field name in UserInfo response containing group/role claims (default: groups)
#group_claim_field = groups
# Single character that splits a STRING-TYPED group claim into individual entries
# (JSON array claims are unaffected; default: ','). Use it when the IdP emits one
# delimited string, e.g. a semicolon-joined 'member_of' attribute:
#group_claim_delimiter = ;
# Require group authorization even when no allow/deny group lists are configured
# (default: false). When true, at least one group list must be populated or the
# request is denied with PAM_PERM_DENIED.
#enforce_groups = false
# Provider groups/roles that grant access; a user matching ANY of these is allowed
#allow_groups = sysadmins,developers,ops
# Provider groups/roles that deny access (takes precedence over allow_groups)
#deny_groups = contractors,interns


[prompt]
# Custom prompt presented to the user during SSH authentication.
# Dynamic Placeholders:
#   {url}          - Verification URL (e.g., https://auth.example.edu/device)
#   {url_complete} - Direct login URL with embedded code if provided by IdP
#   {code}         - User code (e.g., BCD-123)
#   {expiry}       - How long the user has to complete the approval, in compact
#                    units (e.g. "15m", "45s", "1h 5m"); the provider's
#                    expires_in clamped by max_poll_seconds. Expands to an empty
#                    string when the provider does not advertise expires_in.
#   \n             - Line break
# Note: the prompt deliberately names no host — in a device-code phishing attack the
# prompt reaches the user who ran ssh (the attacker), while the approving user only sees the
# IdP's approval page. Machine context belongs in the registered OAuth client name shown on
# that approval page (register one descriptive client per host or cluster); see
# docs/threat-model.md §8.
# Show the device-code approval window in the prompt (default: true). With the
# built-in default template it is named in the trailing status line
# ("Waiting for approval (expires in 15m)."); in
# custom templates use the {expiry} token, which works regardless of this key. Set to
# false to hide the approval window.
#show_expiry = false
# Prompt template: leave init_message unset to use the module's built-in default,
# which renders (the leading blank line separates the prompt from the terminal
# banner that shares its first line; it is omitted when [qr] enabled = true,
# where the QR block's quiet zone provides the separation):
#
#   Sign in via browser:
#     https://auth.example.edu/oauth2/device/code?user_code=XXXX-XXXX
#
#   Manual entry: https://auth.example.edu/oauth2/device/code  |  Code: XXXX-XXXX
#   Waiting for approval (expires in 2m).
# (the compact URL + code block is shown when the provider does not supply a
# direct-link URI). To customize, set init_message to a printable-ASCII template
# using the placeholders {url} (verification URL), {url_complete} (direct-link URL,
# falls back to {url} when the provider does not supply one), {code} (user code),
# {expiry} (compact approval window, e.g. "15m"; empty when unknown), and escaped
# \n newlines.
#init_message = Sign in at {url} with code {code}


[qr]
# Render the verification URI as a scannable QR code in the terminal so the user
# can open the page with a phone camera instead of typing the URL. Shown BEFORE
# the text prompt; if rendering fails for any reason the text prompt is still
# displayed, so authentication never depends on the QR code.
# Master switch (default: false)
#enabled = false
# Glyph style:
#   utf8  - compact UTF-8 half-block glyphs (U+2580/U+2584/U+2588): fewest lines,
#           requires a terminal font that covers these characters (Default).
#   ascii - one block character per module; works with any font, even minimal
#           legacy fonts.
#style = utf8
# Character used for dark modules in the ascii style: any single printable ASCII
# character, no space (default: #)
#block_char = #
# Enlargement factor, 1-3: repeats each module horizontally and vertically so the
# code is easier to photograph (default: 1). Larger values increase the terminal
# footprint; very large combinations may be skipped with a debug log entry.
#scale = 1
# Vertical quiet zone (blank module rows) above and below the code, 0-4
# (default: 4 = ISO/IEC 18004 minimum). The utf8 style renders two module rows
# per text line, so 4 = two blank lines above and below; lower it (e.g. 2) for
# a more compact display at some cost in scanner robustness. The left/right
# quiet zone always stays at the ISO 4-module minimum.
#vertical_quiet_zone = 4
# Error-correction level L (7%), M (15%, default), Q (25%) or H (30%): higher
# levels survive more terminal rendering artifacts at the cost of a larger code.
#ec_level = M
# Which URI to encode:
#   complete - verification_uri_complete, with the user code embedded, so nothing
#              is typed on the second device (default; falls back to plain if the
#              provider does not supply a complete URI).
#   plain    - verification_uri; the user types the code on the second device.
#uri = complete


[runtime]
# Maximum device authorization lifespan in seconds (range: 10 - 3600, default: 120).
# The default is bounded to the PAM-safe 120 s ceiling: SSH LoginGraceTime and
# systemd PAM timeouts are typically shorter than RFC 8628 device-code lifetimes,
# so raise it deliberately only if your PAM stack tolerates a longer block.
max_poll_seconds = 120

# Configures syslog verbosity level across the module.
# Valid options (case-insensitive string or numeric equivalent):
#   none    (0) - Disables all syslog output
#   error   (1) - Logs operational failures and error conditions only
#   info    (2) - Logs high-level auth success/failure lifecycle events (Default)
#   debug   (3) - Logs detailed internal state and claim verification steps
#   verbose (4) - Maximum tracing, including full HTTP transport request/response metrics
loglevel = info
