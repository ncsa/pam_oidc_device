# /etc/pam_oidc_device.conf
#
# Configuration file for pam_oidc_device.so
# OAuth 2.0 Device Authorization Grant authentication
#
# REQUIRED PERMISSIONS:
# Must be owned by root (uid 0) with mode 0600 or 0640 (group gid 0).
#   chown root:root /etc/pam_oidc_device.conf
#   chmod 0600 /etc/pam_oidc_device.conf

[oauth]
# Client credentials (leave client_secret empty for public clients)
client_id = ssh-login-node-client
client_secret = super-secret-key-change-me

# Required HTTPS OAuth 2.0 / OIDC Endpoints
device_authorization_endpoint = https://auth.example.edu/oauth2/device/code
token_endpoint = https://auth.example.edu/oauth2/token
userinfo_endpoint = https://auth.example.edu/oauth2/userinfo

# OAuth Scopes requested during device authorization (default: openid)
scopes = openid profile email

# Optional Local JWT Claim Inspection Settings (claims-only; does not verify the JWT signature)
# Enforce local Base64URL decoding and claims-only checks (exp, nbf, iss, aud) before downstream calls (default: false).
# NOTE: This inspects decoded JWT claims locally; it does NOT verify the JWT signature.
# The signature is still validated by the UserInfo endpoint when the Bearer token is presented.
#verify_jwt_claims = false
# Expected Token Issuer URL ('iss' claim check). Required if verify_jwt_claims = true.
#issuer = https://auth.example.edu/oauth2
# Expected Audience string or comma-separated list ('aud' claim check). Required if verify_jwt_claims = true.
#audience = https://api.example.edu
# Allowed clock skew leeway in seconds when evaluating 'exp' and 'nbf' timestamps (range: 0 - 300, default: 60)
#clock_skew_leeway = 60
# Require a well-formed 'exp' claim in locally verified tokens; reject tokens without one (default: false).
# A missing 'exp' is otherwise accepted and left to the downstream UserInfo endpoint to enforce expiry.
#require_exp_claim = false
# Reserved (parsed/validated but NOT yet used): the module does not currently
# perform JWKS-based JWT signature verification, so jwks_url has no effect.
#jwks_url = https://auth.example.edu/oauth2/jwks
# Reserved (parsed/validated but NOT yet used): RFC 7662 token introspection is
# not currently performed, so introspection_endpoint has no effect.
#introspection_endpoint = https://auth.example.edu/oauth2/introspect


[claim]
# UserInfo response field containing the identity claim to match against PAM_USER (default: sub)
claim_field = preferred_username
# POSIX Extended Regular Expression applied to the identity claim.
# Pin the domain so only claims from your institution map to local accounts: group 1
# captures the username and the @example.edu suffix is REQUIRED, so a claim from another
# domain (or a bare 'jdoe') does NOT map to local 'jdoe'. Replace 'example.edu' with
# your institution's/tenant's registered domain.
# NOTE: the regex is always matched case-sensitively; write the domain in the exact case
# the IdP returns it (lowercase for standard domains).
claim_regex = ^([^@]+)@example[.]edu$
# Capture group index containing the local system username (1 = first sub-group)
claim_capture_group = 1
# Enforce exact case matching between the extracted local username and PAM_USER (default: true).
# NOTE: this governs only the username comparison; it does not affect regex/domain matching.
case_sensitive = true


[access]
# Local account and provider group/role allow/deny lists (comma-separated). Deny lists
# take precedence over allow lists. Matching honors 'case_sensitive' from [claim].
#
# --- Local account controls ---
# Local user lists are evaluated BEFORE any provider contact; a denied account is
# refused with PAM_PERM_DENIED without reaching the identity provider.
# Only these local usernames may authenticate (comma-separated; empty = all allowed)
#allow_users = alice,bob,charlie
# These local usernames are never permitted to authenticate (takes precedence over allow_users)
#deny_users = root,daemon
#
# --- Provider group/role controls ---
# Provider group/role lists are evaluated against the UserInfo group/role claims.
# JSON field name in UserInfo response containing group/role claims (default: groups)
#group_claim_field = groups
# Require group authorization even when no allow/deny group lists are configured
# (default: false). When true, at least one group list must be populated or the
# request is denied with PAM_PERM_DENIED.
#enforce_groups = false
# Provider groups/roles that grant access; a user matching ANY of these is allowed
#allow_groups = sysadmins,developers,ops
# Provider groups/roles that deny access (takes precedence over allow_groups)
#deny_groups = contractors,interns


[prompt]
# Custom prompt presented to the user during SSH authentication.
# Dynamic Placeholders:
#   {url}          - Verification URL (e.g., https://auth.example.edu/device)
#   {url_complete} - Direct login URL with embedded code if provided by IdP
#   {code}         - User code (e.g., BCD-123)
#   \n             - Line break
init_message = \n[Authentication Required] Complete authentication in your web browser:\n Verification URL: {url}\n User Code: {code}\n Direct Link: {url_complete}\n\nPress [Enter] after authenticating in your browser...


[runtime]
# Maximum device authorization lifespan in seconds (range: 10 - 3600, default: 300)
max_poll_seconds = 300

# Configures syslog verbosity level across the module.
# Valid options (case-insensitive string or numeric equivalent):
#   none    (0) - Disables all syslog output
#   error   (1) - Logs operational failures and error conditions only
#   info    (2) - Logs high-level auth success/failure lifecycle events (Default)
#   debug   (3) - Logs detailed internal state and claim verification steps
#   verbose (4) - Maximum tracing, including full HTTP transport request/response metrics
loglevel = info
